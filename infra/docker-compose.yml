# Stack Tesserax (P7.2.4).
#   Stack complète + démo :  docker compose up -d --build        (à la racine du dépôt)
#                            → http://app.localhost:8080 (admin@tesserax.local / Tesserax2026!)
#   Infra seule (dev) :      pnpm infra:up
#   Production (TLS) :       voir docs/exploitation.md (surcouche docker-compose.prod.yml)
# Les valeurs par défaut conviennent au poste local ; surcharger via infra/.env
# (voir .env.example à la racine) pour tout autre usage.
name: tesserax

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://tesserax_app:${TESSERAX_APP_PASSWORD:-tesserax_app}@postgres:5432/tesserax
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
  # Traefik puis nginx (web) devant l'API : l'IP cliente est à deux sauts (limites par IP).
  TRUST_PROXY: 2
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-tesserax}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tesserax}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tesserax-minio-secret}
  GOTENBERG_URL: http://gotenberg:3000
  APP_URL: ${APP_URL:-http://app.localhost:8080}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Tesserax <no-reply@tesserax.local>}
  WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-true}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TESSERAX_OWNER_PASSWORD: ${TESSERAX_OWNER_PASSWORD:-tesserax_owner}
      TESSERAX_APP_PASSWORD: ${TESSERAX_APP_PASSWORD:-tesserax_app}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5440}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tesserax']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Fork communautaire de MinIO : l'éditeur ne publie plus d'images Docker depuis fin 2025.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tesserax}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tesserax-minio-secret}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tesserax}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tesserax-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-tesserax}
    entrypoint: ['/bin/sh', '-c']
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: 'no'

  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ['127.0.0.1:${GOTENBERG_PORT:-3001}:3000']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Applications ----------

  migrate:
    image: tesserax/api:dev
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ['sh', '-c', 'pnpm db:deploy && pnpm db:seed']
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://tesserax_owner:${TESSERAX_OWNER_PASSWORD:-tesserax_owner}@postgres:5432/tesserax
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: tesserax/api:dev
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.services.api.loadbalancer.server.port=3000

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/health']
      interval: 10s
      timeout: 3s
      retries: 20

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment:
      # Origine du stockage autorisée par la CSP (photos et dépôts par URL signée).
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    depends_on:
      api: { condition: service_healthy }
    # Fond de carte PMTiles extrait par infra/maps/fetch-basemap.sh (facultatif).
    volumes: ['./maps/data:/srv/tiles:ro']
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`app.localhost`)
      - traefik.http.services.web.loadbalancer.server.port=80

  # Inspections localisées de démonstration, saisies par l'API (une seule fois : --si-vide).
  # Réseau de MinIO : `localhost:9000` (adresse des URL signées) y désigne bien le stockage.
  demo:
    image: node:24-alpine
    network_mode: service:minio
    environment:
      API_URL: http://api:3000
    volumes: ['./demo:/demo:ro']
    command: ['node', '/demo/fiches-terrain.mjs', '--si-vide']
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_healthy }
    restart: 'no'

  # Sauvegardes quotidiennes et vérification de restauration (P7.2.1, docs/exploitation.md).
  backup:
    build: { context: ./backup }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: tesserax
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-tesserax}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tesserax}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tesserax-minio-secret}
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: ['${BACKUP_DIR:-./backups}:/backups']
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  # Point d'entrée HTTP local ; TLS Let's Encrypt : docker-compose.prod.yml.
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:80']
    volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro']
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
