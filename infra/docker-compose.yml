# Stack Tesserax.
#   Infra seule (dev) :      pnpm infra:up
#   Stack complète + démo :  docker compose -f infra/docker-compose.yml --profile full up -d --build
# Les valeurs par défaut conviennent au développement local ; surcharger via infra/.env
# (voir .env.example à la racine) pour tout autre usage.
name: tesserax

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://tesserax_app:${TESSERAX_APP_PASSWORD:-tesserax_app}@postgres:5432/tesserax
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
  TRUST_PROXY: 1
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-tesserax}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tesserax}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tesserax-minio-secret}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TESSERAX_OWNER_PASSWORD: ${TESSERAX_OWNER_PASSWORD:-tesserax_owner}
      TESSERAX_APP_PASSWORD: ${TESSERAX_APP_PASSWORD:-tesserax_app}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5440}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tesserax']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Fork communautaire de MinIO : l'éditeur ne publie plus d'images Docker depuis fin 2025.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tesserax}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tesserax-minio-secret}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tesserax}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tesserax-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-tesserax}
    entrypoint: ['/bin/sh', '-c']
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: 'no'

  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ['127.0.0.1:${GOTENBERG_PORT:-3001}:3000']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Applications (profil "full") ----------

  migrate:
    profiles: [full]
    image: tesserax/api:dev
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ['sh', '-c', 'pnpm db:deploy && pnpm db:seed']
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://tesserax_owner:${TESSERAX_OWNER_PASSWORD:-tesserax_owner}@postgres:5432/tesserax
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    profiles: [full]
    image: tesserax/api:dev
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.services.api.loadbalancer.server.port=3000

  worker:
    profiles: [full]
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    profiles: [full]
    build: { context: .., dockerfile: apps/web/Dockerfile }
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`app.localhost`)
      - traefik.http.services.web.loadbalancer.server.port=80

  # TLS Let's Encrypt et variante Tailscale : P7.2.3.
  traefik:
    profiles: [full]
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:80']
    volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro']
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
