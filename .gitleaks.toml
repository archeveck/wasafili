# Détection de secrets (P7.4.3) : règles par défaut de gitleaks, plus les secrets de clés API
# Wasafili, reconnaissables à leur préfixe.
[extend]
useDefault = true

[[rules]]
id = "wasafili-api-key-secret"
description = "Secret de clé API Wasafili (client_credentials)"
regex = '''wsfsk_[A-Za-z0-9_-]{43}'''
keywords = ["wsfsk_"]
