# Remet l'appareil à zéro (déconnexion = données locales effacées), avant un parcours complet.
appId: com.wasafili.app
env:
  APP_URL: wasafili://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
---
- stopApp
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible:
      text: .*(Se connecter|synchronis|attente|erreur).*
    timeout: 60000
- runFlow:
    when:
      notVisible: Se connecter
    commands:
      - tapOn: .*État de la synchronisation.*
      - scrollUntilVisible:
          element: Se déconnecter
      - tapOn: Se déconnecter
      # Bouton de la boîte de confirmation (au-dessus d'« Annuler »), pas le lien de la page.
      - tapOn:
          text: Se déconnecter
          above: Annuler
- assertVisible: Se connecter
