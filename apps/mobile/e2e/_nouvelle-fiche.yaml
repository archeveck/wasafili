# Sous-parcours : une inspection « Bon » sur le premier équipement, signée, envoyée.
appId: host.exp.Exponent
---
- tapOn: Nouvelle fiche
- tapOn:
    text: Choisir…
    index: 0
- tapOn: Plateau — Tour Alpha.*
- tapOn:
    text: Choisir…
    index: 0
- tapOn: Bâtiment A.*
- tapOn:
    text: Choisir…
    index: 0
- tapOn: ${EQUIPEMENT}.*
- tapOn:
    text: Continue
    optional: true
# Le pied de page (boutons) recouvre le bas de l'écran : amener le choix au centre.
- scrollUntilVisible:
    element: Bon
    centerElement: true
- tapOn: Bon
- scrollUntilVisible:
    element: Signer
- tapOn: Signer
- swipe:
    start: 30%, 50%
    end: 70%, 55%
- tapOn: Valider
- tapOn: Envoyer
