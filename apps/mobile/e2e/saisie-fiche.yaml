# Parcours de saisie d'une inspection (P3.8) : connexion, téléchargement, saisie, envoi.
# Lancer : maestro test e2e/saisie-fiche.yaml (API locale démarrée, seed de démonstration).
appId: com.wasafili.app
env:
  EMAIL: technicien@wasafili.local
  PASSWORD: Wasafili2026!
  APP_URL: wasafili://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
---
# Client de développement (`npx expo run:ios`) : (ré)ouverture du projet servi par Metro.
# Avec un build autonome (preview, production), utiliser plutôt `launchApp`.
- stopApp
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible:
      # Texte des boutons fusionné dans leur libellé d'accessibilité : correspondance partielle.
      text: .*(Se connecter|Tout est synchronisé|en attente).*
    timeout: 60000
- runFlow:
    when:
      visible: Se connecter
    commands:
      - tapOn:
          id: login-email
      - inputText: ${EMAIL}
      - tapOn:
          id: login-password
      - inputText: ${PASSWORD}
      - tapOn: Se connecter
# Proposition d'iOS d'enregistrer le mot de passe.
- tapOn:
    text: Plus tard
    optional: true
- extendedWaitUntil:
    visible: Inspection équipement
    timeout: 20000
- tapOn: Inspection équipement
- tapOn: Nouvelle fiche
- tapOn:
    text: Choisir…
    index: 0
- tapOn: Plateau — Tour Alpha.*
- tapOn:
    text: Choisir…
    index: 0
- tapOn: Bâtiment A.*
- tapOn:
    text: Choisir…
    index: 0
- tapOn: Groupe électrogène 250 kVA.*
# Tutoriel clavier d'iOS (première saisie sur un simulateur neuf).
- tapOn:
    text: Continue
    optional: true
# Le pied de page (boutons) recouvre le bas de l'écran : amener le choix au centre.
- scrollUntilVisible:
    element: Bon
    centerElement: true
- tapOn: Bon
- scrollUntilVisible:
    element: Signer
- tapOn: Signer
- swipe:
    start: 30%, 50%
    end: 70%, 55%
- tapOn: Valider
- tapOn: Envoyer
- extendedWaitUntil:
    visible: .*Tout est synchronisé.*
    timeout: 30000
- assertVisible: .*Envoyée.*
