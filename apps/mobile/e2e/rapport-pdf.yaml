# Rapport PDF d'une fiche depuis le mobile (P5.1.5), en ligne : généré par le serveur et
# affiché dans le navigateur intégré. Prérequis : une fiche envoyée (ex. saisie-fiche.yaml).
appId: com.wasafili.app
env:
  APP_URL: wasafili://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
---
- stopApp
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible: .*Tout est synchronisé.*
    timeout: 60000
- openLink: wasafili://submissions
- tapOn:
    text: .*Plateau — Tour Alpha.*
    index: 0
- scrollUntilVisible:
    element: Rapport PDF
    direction: UP
- tapOn: Rapport PDF
# Navigateur intégré (SFSafariViewController) : bouton de fermeture.
- extendedWaitUntil:
    visible: (OK|Done|Terminé|Fermer)
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: rapport-pdf
- tapOn: (OK|Done|Terminé|Fermer)
- assertVisible: Rapport PDF
