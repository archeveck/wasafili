# En-têtes de sécurité du back-office (P7.4.2), inclus dans chaque bloc qui ajoute ses propres
# en-têtes (nginx n'hérite pas des add_header du niveau supérieur). HSTS est posé par Traefik,
# qui termine TLS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${S3_PUBLIC_ORIGIN}; connect-src 'self' ${S3_PUBLIC_ORIGIN}; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
