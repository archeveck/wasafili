name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint --cache-dir=.turbo
      - run: pnpm typecheck --cache-dir=.turbo
      - run: pnpm test --cache-dir=.turbo

  security:
    name: Sécurité (audit des dépendances, recherche de secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Vulnérabilités hautes ou critiques des dépendances livrées (exceptions justifiées :
      # pnpm-workspace.yaml, docs/security/dependances.md).
      - run: pnpm audit --prod --audit-level=high
      # Tout l'historique : un secret retiré d'un fichier reste dans git.
      - name: Recherche de secrets (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo
          --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore
          --no-banner --redact

  integration:
    name: Tests d'intégration API (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://wasafili_app:wasafili_app@localhost:5432/wasafili_test
      TEST_DATABASE_OWNER_URL: postgresql://wasafili_owner:wasafili_owner@localhost:5432/wasafili_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: wasafili
      S3_SECRET_KEY: wasafili-minio-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Rôles et bases PostgreSQL (même script que docker compose)
        run: sh infra/postgres/01-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          WASAFILI_OWNER_PASSWORD: wasafili_owner
          WASAFILI_APP_PASSWORD: wasafili_app
      - name: MinIO (même image que docker compose) et bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=wasafili -e MINIO_ROOT_PASSWORD=wasafili-minio-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done
          docker run --rm --network host --entrypoint sh pgsty/mc:RELEASE.2026-09-16T00-00-00Z -c \
            'mc alias set local http://localhost:9000 wasafili wasafili-minio-secret && mc mb local/wasafili'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: Parcours e2e du back-office (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Rôles et bases PostgreSQL
        run: sh infra/postgres/01-roles.sh
        env:
          PGHOST: localhost
          PGPORT: 5440
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          WASAFILI_OWNER_PASSWORD: wasafili_owner
          WASAFILI_APP_PASSWORD: wasafili_app
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm --filter @wasafili/web exec playwright install --with-deps chromium
      - run: pnpm --filter @wasafili/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  mobile:
    name: Bundle de l'application mobile (Metro / Hermes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@wasafili/mobile^..." build
      - run: pnpm --filter @wasafili/mobile exec expo export --platform ios --output-dir dist-check
      - run: pnpm --filter @wasafili/mobile exec expo export --platform android --output-dir dist-check

  # Builds natifs sans compte Expo (D2, P7.3) : expo prebuild puis outils natifs. Longs : sur
  # la branche principale seulement. Les builds signés passent par EAS (eas.json).
  android:
    name: Build Android autonome (prebuild + Gradle)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: preview
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@wasafili/mobile^..." build
      - run: pnpm --filter @wasafili/mobile exec expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: wasafili-android-preview
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  ios:
    name: Build iOS autonome (prebuild + Xcode, simulateur)
    if: github.event_name == 'push'
    runs-on: macos-15
    env:
      APP_VARIANT: preview
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@wasafili/mobile^..." build
      - run: pnpm --filter @wasafili/mobile exec expo prebuild --platform ios
      - name: Compilation pour le simulateur (sans signature)
        working-directory: apps/mobile/ios
        run: >-
          xcodebuild -workspace *.xcworkspace -scheme "$(basename *.xcworkspace .xcworkspace)"
          -configuration Release -sdk iphonesimulator -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build

  docker:
    name: Build des images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infra/docker-compose.yml build
