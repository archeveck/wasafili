name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint --cache-dir=.turbo
      - run: pnpm typecheck --cache-dir=.turbo
      - run: pnpm test --cache-dir=.turbo

  integration:
    name: Tests d'intégration API (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://tesserax_app:tesserax_app@localhost:5432/tesserax_test
      TEST_DATABASE_OWNER_URL: postgresql://tesserax_owner:tesserax_owner@localhost:5432/tesserax_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: tesserax
      S3_SECRET_KEY: tesserax-minio-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Rôles et bases PostgreSQL (même script que docker compose)
        run: sh infra/postgres/01-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          TESSERAX_OWNER_PASSWORD: tesserax_owner
          TESSERAX_APP_PASSWORD: tesserax_app
      - name: MinIO (même image que docker compose) et bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tesserax -e MINIO_ROOT_PASSWORD=tesserax-minio-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done
          docker run --rm --network host --entrypoint sh pgsty/mc:RELEASE.2026-09-16T00-00-00Z -c \
            'mc alias set local http://localhost:9000 tesserax tesserax-minio-secret && mc mb local/tesserax'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: Parcours e2e du back-office (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Rôles et bases PostgreSQL
        run: sh infra/postgres/01-roles.sh
        env:
          PGHOST: localhost
          PGPORT: 5440
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          TESSERAX_OWNER_PASSWORD: tesserax_owner
          TESSERAX_APP_PASSWORD: tesserax_app
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm --filter @tesserax/web exec playwright install --with-deps chromium
      - run: pnpm --filter @tesserax/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  docker:
    name: Build des images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infra/docker-compose.yml --profile full build
